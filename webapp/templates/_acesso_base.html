<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Nenhuma destas telas manda o endereço da página para fora: a de criar
     senha nasce de um link secreto (ver definir_senha_link em app.py). -->
<meta name="referrer" content="no-referrer">
<title>{% block titulo %}ERP Smith — Login{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
<!-- Identidade visual Smith (preto/azul/branco da marca) por cima do
     tema padrão do AdminLTE -- mesma paleta de
     portal/templates/_portal_estilo.html, duplicada aqui de propósito
     (mesmo padrão do resto do projeto: cada app Flask tem seu CSS
     próprio, sem framework/build step comum). Base comum das telas de
     acesso (2026-10-20): Entrar, Criar senha e Esqueci minha senha. -->
<style>
  /* Tema 2026-09 -- o mesmo do painel e do Portal: papel claro, tinta,
     um azul só, nada em maiúsculas, borda fina no lugar de sombra
     pesada. O fundo continua escuro porque é onde o logo branco vive. */
  :root { --tinta: #16181D; --aco: #5B6470; --linha: #E3E6E8;
          --blue: #2F5FA7; --blue-deep: #244A85; --blue-soft: #E8EEF8; }
  body, .login-card-body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; color: var(--tinta); }
  body.login-page { background: var(--tinta); }
  .login-box { width: 360px; max-width: calc(100% - 32px); }
  .login-logo { text-align: center; margin-bottom: 1.8rem; }
  .login-logo img { height: 52px; }
  .card { border: 0; border-radius: 12px; box-shadow: 0 16px 40px rgba(0,0,0,.35); }
  .login-card-body { padding: 28px; border-radius: 12px; }
  .login-titulo { font-family: 'Big Shoulders', sans-serif; font-weight: 700; font-size: 28px;
                  line-height: 1; margin: 0 0 4px; }
  .login-sub { color: var(--aco); margin: 0 0 20px; }
  label { font-size: 12px; font-weight: 600; color: var(--aco); margin-bottom: 4px; }
  .form-control { height: 40px; font-size: 14px; border-radius: 8px; border-color: #D5D9DD; }
  .form-control:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
  .btn { height: 40px; font-size: 14px; font-weight: 600; border-radius: 8px;
         display: inline-flex; align-items: center; justify-content: center; }
  .btn-primary { background-color: var(--blue); border-color: var(--blue); }
  .btn-primary:hover, .btn-primary:focus, .btn-primary:active { background-color: var(--blue-deep) !important; border-color: var(--blue-deep) !important; }
  .btn-primary:focus-visible { box-shadow: 0 0 0 3px var(--blue-soft) !important; }
  .alert-danger { background: #FBEDEB; color: #8E2A20; border-color: #F0C4BE; border-radius: 8px; }
  .alert-success { background: #E8F4EC; color: #1F5A38; border-color: #C6E3D0; border-radius: 8px; }
  .login-rodape { text-align: center; margin: 16px 0 0; font-size: 13px; }
  .login-rodape a { color: var(--blue); }
  .dica { color: var(--aco); font-size: 12px; margin-top: 4px; }
</style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <img src="{{ url_for('static', filename='img/logo_smith_white.png') }}" alt="Smith Clube de Tiro — Marília SP" width="107" height="52">
  </div>
  <div class="card">
    <div class="card-body login-card-body">
      {% block conteudo %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
