<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Smith — Login</title>
<style>
  :root {
    --bg: #EEF0E8; --surface: #F8F9F3; --ink: #1E231C;
    --muted: #5B6154; --accent: #A8402A; --line: #C9CDBD;
    --bad: #A8402A; --bad-soft: #A8402A1a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14160F; --surface: #1C1F16; --ink: #E9E7DA;
      --muted: #A2A594; --accent: #E08361; --line: #33372A;
      --bad: #E08361; --bad-soft: #E083612a;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 2rem 2.2rem; width: 100%; max-width: 340px;
  }
  h1 { font-family: Georgia, serif; font-weight: 400; font-size: 1.4rem; margin: 0 0 0.3rem; }
  .subtitle { color: var(--muted); margin: 0 0 1.6rem; font-size: 0.88rem; }
  label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 0.3rem; }
  input {
    width: 100%; font-family: inherit; font-size: 0.92rem; padding: 0.55rem 0.7rem;
    border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
  }
  .form-row { margin-bottom: 0.9rem; }
  button {
    width: 100%; background: var(--accent); color: #F8F5EF; border: none; border-radius: 8px;
    padding: 0.65rem 1rem; font-size: 0.92rem; cursor: pointer; font-family: inherit; margin-top: 0.4rem;
  }
  .erro-box {
    background: var(--bad-soft); color: var(--bad); border-radius: 8px;
    padding: 0.6rem 0.8rem; font-size: 0.85rem; margin-bottom: 1rem;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>ERP Smith</h1>
    <p class="subtitle">Painel administrativo — faça login para continuar.</p>
    {% if erro %}<div class="erro-box">{{ erro }}</div>{% endif %}
    <form method="post">
      <div class="form-row">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required autofocus>
      </div>
      <div class="form-row">
        <label for="senha">Senha</label>
        <input id="senha" name="senha" type="password" required>
      </div>
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
