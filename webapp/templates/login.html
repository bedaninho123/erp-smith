<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Smith — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
<!-- Identidade visual Smith (preto/azul/branco da marca) por cima do
     tema padrão do AdminLTE -- mesma paleta de
     portal/templates/_portal_estilo.html, duplicada aqui de propósito
     (mesmo padrão do resto do projeto: cada app Flask tem seu CSS
     próprio, sem framework/build step comum). -->
<style>
  :root { --ink-deep: #131417; --blue: #396BB3; --blue-deep: #24487D; }
  /* Mesma família do painel e do Portal -- a tela de entrada é a
     primeira impressão do sistema, não pode ser a única com outra
     fonte. */
  body, .login-card-body { font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; }
  .btn { height: 38px; font-size: 14px; font-weight: 600; display: inline-flex;
    align-items: center; justify-content: center; }
  .form-control { height: 38px; font-size: 14px; }
  body.login-page { background: var(--ink-deep); }
  .login-logo { text-align: center; margin-bottom: 1.6rem; }
  .login-logo img { height: 52px; }
  .btn-primary { background-color: var(--blue); border-color: var(--blue); }
  .btn-primary:hover, .btn-primary:focus, .btn-primary:active { background-color: var(--blue-deep) !important; border-color: var(--blue-deep) !important; }
  a { color: var(--blue-deep); }
  a:hover { color: var(--blue); }
</style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="login-logo">
    <img src="{{ url_for('static', filename='img/logo_smith_white.png') }}" alt="Smith Clube de Tiro — Marília SP">
  </div>
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Painel administrativo — faça login para continuar</p>

      {% if erro %}
      <div class="alert alert-danger py-2">{{ erro }}</div>
      {% endif %}

      <form method="post">
        <div class="input-group mb-3">
          <input id="email" name="email" type="email" class="form-control" placeholder="E-mail" required autofocus>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-envelope"></span></div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input id="senha" name="senha" type="password" class="form-control" placeholder="Senha" required>
          <div class="input-group-append">
            <div class="input-group-text"><span class="fas fa-lock"></span></div>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" class="btn btn-primary btn-block">Entrar</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/js/adminlte.min.js"></script>
</body>
</html>
