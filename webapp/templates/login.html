{% extends "_acesso_base.html" %}
{% block conteudo %}
      <h1 class="login-titulo">Entrar</h1>
      <p class="login-sub">Painel do Smith</p>

      {% if aviso %}
      <div class="alert alert-success py-2" role="status">{{ aviso }}</div>
      {% endif %}
      {% if erro %}
      <div class="alert alert-danger py-2">{{ erro }}</div>
      {% endif %}

      <form method="post">
        <!-- autocomplete: sem estes valores o gerenciador de senhas não
             reconhece o formulário e não oferece preenchimento. Rótulo
             visível no lugar do ícone ao lado do campo (2026-09-24): o
             ícone não dizia nada que o rótulo não diga melhor. -->
        <div class="form-group">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="email" class="form-control"
            autocomplete="username" spellcheck="false" required autofocus>
        </div>
        <div class="form-group mb-4">
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" class="form-control"
            autocomplete="current-password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
      <p class="login-rodape"><a href="{{ url_for('esqueci_senha') }}">Esqueci minha senha</a></p>
{% endblock %}
