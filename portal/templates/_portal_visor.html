{# Visualizador de documento + botões de ação, comum a "Minha conta" e ao
   documento pronto do processo (2026-10-20). Incluir no FIM do bloco de
   conteúdo: o script liga os botões .btn-ver que já estão na página. #}
<style>
  .doc-acoes { display: flex; gap: .5rem; flex-shrink: 0; flex-wrap: wrap; }

  /* Botão de ação do documento. Altura fixa para os dois ficarem
     alinhados mesmo com textos de larguras diferentes. */
  .doc-botao {
    height: 34px; padding: 0 .8rem; border-radius: 4px; font-size: .82rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: .35rem; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink); text-decoration: none;
  }
  .doc-botao:hover { border-color: var(--steel); color: var(--ink); text-decoration: none; }
  .doc-botao--principal { background: var(--blue); border-color: var(--blue); color: #fff; }
  .doc-botao--principal:hover { background: var(--blue-deep); border-color: var(--blue-deep); color: #fff; }

  /* Visualizador: o documento abre POR CIMA do portal, que continua
     atrás. É o mesmo princípio do painel administrativo -- abrir numa
     aba nova deixaria a pessoa sem caminho de volta, porque o navegador
     não oferece "fechar e voltar" numa aba que só mostra um PDF. */
  .visor { position: fixed; inset: 0; z-index: 2000; background: rgba(10,11,13,.9);
           display: none; flex-direction: column; }
  .visor.aberto { display: flex; }
  .visor-barra { display: flex; align-items: center; gap: .75rem; padding: .7rem 1rem;
                 background: rgba(0,0,0,.45); color: #fff; }
  .visor-nome { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .9rem; }
  .visor-corpo { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 1rem; }
  .visor-corpo img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .visor-corpo iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .visor-botao { height: 34px; padding: 0 .8rem; border-radius: 4px; border: 1px solid rgba(255,255,255,.35);
                 background: transparent; color: #fff; font-size: .82rem; font-weight: 600; cursor: pointer;
                 display: inline-flex; align-items: center; gap: .35rem; text-decoration: none; }
  .visor-botao:hover { background: rgba(255,255,255,.12); color: #fff; text-decoration: none; }

  /* Galeria (2026-11-12): botões com o mesmo data-galeria viram uma
     sequência -- arrastar o dedo para o lado troca de foto, e no computador
     as setas fazem o mesmo. pan-y deixa o navegador cuidar só do vertical
     e da pinça; o horizontal é nosso. */
  .visor-corpo { position: relative; touch-action: pan-y pinch-zoom; }
  .visor-corpo img { transition: transform .2s ease; }
  .visor-corpo img.arrastando { transition: none; }
  .visor-seta {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 1;
    width: 44px; height: 44px; border-radius: 50%; border: 0; cursor: pointer;
    background: rgba(0,0,0,.45); color: #fff; font-size: 1.4rem; line-height: 1;
    display: none; align-items: center; justify-content: center;
  }
  .visor-seta--anterior { left: .6rem; }
  .visor-seta--proxima { right: .6rem; }
  .visor.galeria .visor-seta { display: flex; }
  .visor-seta:disabled { opacity: .25; cursor: default; }
</style>

<div class="visor" id="visor" role="dialog" aria-modal="true" aria-label="Visualizador de documento">
  <div class="visor-barra">
    <span class="visor-nome" id="visor-nome"></span>
    <a class="visor-botao" id="visor-baixar" href="#">Salvar arquivo</a>
    <button type="button" class="visor-botao" id="visor-fechar">Fechar</button>
  </div>
  <div class="visor-corpo" id="visor-corpo"></div>
  <button type="button" class="visor-seta visor-seta--anterior" id="visor-anterior" aria-label="Foto anterior">&#8249;</button>
  <button type="button" class="visor-seta visor-seta--proxima" id="visor-proxima" aria-label="Próxima foto">&#8250;</button>
</div>

<script>
  (function () {
    var visor = document.getElementById("visor");
    var corpo = document.getElementById("visor-corpo");
    var nome = document.getElementById("visor-nome");
    var baixar = document.getElementById("visor-baixar");
    // Guarda quem tinha o foco antes de abrir, para devolver ao fechar --
    // quem navega por teclado volta ao mesmo lugar da lista.
    var focoAnterior = null;
    var anterior = document.getElementById("visor-anterior");
    var proxima = document.getElementById("visor-proxima");
    // Galeria aberta agora: os botões do mesmo data-galeria, sem repetir
    // endereço (a capa do anúncio e a primeira miniatura são a mesma foto).
    var galeria = [];
    var posicao = 0;

    function montarGaleria(botao) {
      var nomeGaleria = botao.getAttribute("data-galeria");
      if (!nomeGaleria) return [botao];
      var vistos = {};
      var lista = [];
      Array.prototype.forEach.call(document.querySelectorAll(".btn-ver"), function (b) {
        var url = b.getAttribute("data-url");
        if (b.getAttribute("data-galeria") === nomeGaleria && !vistos[url]) {
          vistos[url] = true;
          lista.push(b);
        }
      });
      return lista;
    }

    function irPara(indice) {
      if (indice < 0 || indice >= galeria.length) return false;
      posicao = indice;
      mostrar(galeria[posicao]);
      anterior.disabled = posicao === 0;
      proxima.disabled = posicao === galeria.length - 1;
      // Já pede a vizinha ao servidor, para a troca não piscar em branco.
      [posicao - 1, posicao + 1].forEach(function (i) {
        if (galeria[i]) (new Image()).src = galeria[i].getAttribute("data-url");
      });
      return true;
    }

    function abrir(botao) {
      galeria = montarGaleria(botao);
      visor.classList.toggle("galeria", galeria.length > 1);
      focoAnterior = document.activeElement;
      visor.classList.add("aberto");
      irPara(Math.max(0, galeria.indexOf(botao)));
      document.getElementById("visor-fechar").focus();
    }

    function mostrar(botao) {
      var url = botao.getAttribute("data-url");
      var titulo = botao.getAttribute("data-nome");
      corpo.innerHTML = "";
      var elemento;
      if (botao.getAttribute("data-imagem") === "1") {
        elemento = document.createElement("img");
        elemento.alt = titulo;
      } else {
        elemento = document.createElement("iframe");
        elemento.title = titulo;
      }
      elemento.src = url;
      corpo.appendChild(elemento);
      nome.textContent = titulo;
      // Foto de anúncio do Marketplace não tem "Salvar": o arquivo é de
      // outra pessoa, e o botão só existe onde data-baixar foi dado.
      var urlBaixar = botao.getAttribute("data-baixar");
      baixar.style.display = urlBaixar ? "" : "none";
      baixar.setAttribute("href", urlBaixar || "#");
    }

    // Deslizar o dedo: a foto acompanha o dedo enquanto arrasta e, se
    // passou de 50px na horizontal, troca. Menos que isso (ou arrasto mais
    // vertical que horizontal) volta para o lugar -- é toque, não gesto.
    var inicioX = null, inicioY = 0, deslocamento = 0;
    corpo.addEventListener("touchstart", function (e) {
      if (galeria.length < 2 || e.touches.length !== 1) { inicioX = null; return; }
      inicioX = e.touches[0].clientX;
      inicioY = e.touches[0].clientY;
      deslocamento = 0;
    }, { passive: true });
    corpo.addEventListener("touchmove", function (e) {
      if (inicioX === null) return;
      if (e.touches.length !== 1) { inicioX = null; return; }  // virou pinça
      deslocamento = e.touches[0].clientX - inicioX;
      if (Math.abs(deslocamento) < Math.abs(e.touches[0].clientY - inicioY)) return;
      var img = corpo.querySelector("img");
      if (img) {
        img.classList.add("arrastando");
        img.style.transform = "translateX(" + deslocamento + "px)";
      }
    }, { passive: true });
    corpo.addEventListener("touchend", function () {
      if (inicioX === null) return;
      inicioX = null;
      var img = corpo.querySelector("img");
      if (img) { img.classList.remove("arrastando"); img.style.transform = ""; }
      if (Math.abs(deslocamento) > 50) irPara(posicao + (deslocamento < 0 ? 1 : -1));
    });

    anterior.addEventListener("click", function () { irPara(posicao - 1); });
    proxima.addEventListener("click", function () { irPara(posicao + 1); });

    function fechar() {
      visor.classList.remove("aberto");
      // Esvaziar não é zelo: sem isso o PDF continua carregado e, na
      // próxima abertura, o documento ANTERIOR pisca por um instante.
      corpo.innerHTML = "";
      if (focoAnterior) focoAnterior.focus();
    }

    Array.prototype.forEach.call(document.querySelectorAll(".btn-ver"), function (botao) {
      botao.addEventListener("click", function () { abrir(botao); });
    });
    document.getElementById("visor-fechar").addEventListener("click", fechar);
    visor.addEventListener("click", function (e) {
      if (e.target === visor || e.target === corpo) fechar();
    });
    document.addEventListener("keydown", function (e) {
      if (!visor.classList.contains("aberto")) return;
      if (e.key === "Escape") fechar();
      if (e.key === "ArrowLeft") irPara(posicao - 1);
      if (e.key === "ArrowRight") irPara(posicao + 1);
    });
  })();
</script>
