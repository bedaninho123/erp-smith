<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Portal do Cliente{% endblock %} — Smith Clube de Tiro</title>
{% include "_portal_estilo.html" %}
{% block estilo_extra %}{% endblock %}
</head>
<body>
<!-- Primeiro elemento focável da página: some da tela até receber foco.
     Sem ele, quem navega por teclado atravessa os 6 links do menu de
     novo em cada página antes de chegar ao conteúdo. -->
<a href="#conteudo" class="pular-para-conteudo">Pular para o conteúdo</a>
<div class="portal-shell">
  <!-- O checkbox é o controle de verdade do menu (a técnica é
       checkbox + CSS, sem JS). Ele fica invisível mas CONTINUA no
       caminho do Tab -- por isso precisa de nome: sem o aria-label,
       quem usa teclado tabulava até um controle que não vê e que não
       se anuncia. O foco dele acende o ☰ visível, mais abaixo. -->
  <input type="checkbox" id="portal-menu-toggle" class="portal-menu-toggle-input"
    aria-label="Abrir ou fechar o menu de navegação">
  <label for="portal-menu-toggle" class="portal-overlay" aria-hidden="true"></label>

  <aside class="portal-sidebar">
    <div class="portal-sidebar-marca">
      <img class="marca-logo" width="900" height="439" src="{{ url_for('static', filename='img/logo_smith_white.png') }}" alt="Smith Clube de Tiro — Marília SP">
    </div>
    <nav class="portal-nav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'ativo' if ativo == 'home' }}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 10 4l7 6.5"/><path d="M5 9v7h10V9"/><path d="M8 16v-4h4v4"/></svg>
        Início
      </a>
      <a href="{{ url_for('casos_lista') }}" class="{{ 'ativo' if ativo == 'casos' }}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h4.5l1.5 1.8H17V15a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6z"/></svg>
        Meus casos
      </a>
      <a href="{{ url_for('processos') }}" class="{{ 'ativo' if ativo == 'processos' }}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="12" height="14" rx="1.2"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5"/></svg>
        Processos
      </a>
      <a href="{{ url_for('campeonatos') }}" class="{{ 'ativo' if ativo == 'campeonatos' }}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="14" height="14" rx="1.2"/><path d="M3 7.5h14"/><path d="M7 3v2M13 3v2"/></svg>
        Campeonatos
      </a>
      <a href="{{ url_for('resultados') }}" class="{{ 'ativo' if ativo == 'resultados' }}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 5.5h9M8 10h9M8 14.5h9"/>
          <text x="2.2" y="7.2" font-size="5.2" font-family="'IBM Plex Mono', monospace" fill="currentColor" stroke="none">1</text>
          <text x="2.2" y="11.7" font-size="5.2" font-family="'IBM Plex Mono', monospace" fill="currentColor" stroke="none">2</text>
          <text x="2.2" y="16.2" font-size="5.2" font-family="'IBM Plex Mono', monospace" fill="currentColor" stroke="none">3</text>
        </svg>
        Resultados
      </a>
      <a href="{{ url_for('minha_conta') }}" class="{{ 'ativo' if ativo == 'minha_conta' }}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7" r="3.2"/><path d="M4 16.5c0-3 2.7-4.8 6-4.8s6 1.8 6 4.8"/></svg>
        Minha conta
      </a>
      <a href="{{ url_for('habitualidade') }}" class="{{ 'ativo' if ativo == 'habitualidade' }}">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10" cy="10" r="7"/><circle cx="10" cy="10" r="3.7"/><circle cx="10" cy="10" r=".6" fill="currentColor" stroke="none"/></svg>
        Habitualidade
      </a>
    </nav>
    <div class="portal-sidebar-rodape">
      {{ cliente_nome }}
      <a href="{{ url_for('sair') }}">Sair</a>
    </div>
  </aside>

  <div class="portal-main">
    <label for="portal-menu-toggle" class="portal-topo-mobile">
      <span aria-hidden="true">☰</span>
      <img class="marca-logo" width="900" height="439" src="{{ url_for('static', filename='img/logo_smith_white.png') }}" alt="Smith Clube de Tiro — Marília SP">
    </label>
    <main class="portal-conteudo" id="conteudo" tabindex="-1">
      {% block conteudo %}{% endblock %}
    </main>
  </div>
</div>
</body>
</html>
