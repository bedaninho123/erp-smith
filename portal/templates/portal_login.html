<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portal do Cliente — Smith Clube de Tiro</title>
{% include "_portal_estilo.html" %}
<style>
  .pagina-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--ink-deep);
  }
  .caixa-login { width: 100%; max-width: 380px; }
  .caixa-login .marca-logo { margin: 0 auto 1.6rem; }
  .caixa-login .ficha { padding: 1.6rem 1.5rem; }
  .subtitulo { color: var(--steel); font-size: .88rem; margin: -.2rem 0 1.2rem; }
  .ajuda { color: var(--steel); font-size: .78rem; margin-top: .6rem; }
</style>
</head>
<body>
<div class="pagina-login">
  <div class="caixa-login">
    <img class="marca-logo marca-logo--grande" width="900" height="439" src="{{ url_for('static', filename='img/logo_smith_white.png') }}" alt="Smith Clube de Tiro — Marília SP">
    <div class="ficha">
      <h1 style="font-size:1.25rem; margin:0 0 .2rem;">Portal do Cliente</h1>
      <p class="subtitulo">Acompanhe seus processos e envie documentos</p>

      {% if mensagem %}
      <div class="aviso">{{ mensagem }}</div>
      {% else %}
      <form method="post">
        <label for="identificador">CPF ou e-mail cadastrado</label>
        <!-- autocomplete=username: é o identificador de acesso, então o
             navegador e o gerenciador de senhas podem oferecer o que a
             pessoa já usou aqui. spellcheck desligado porque corretor
             ortográfico em CPF e e-mail só atrapalha. -->
        <input id="identificador" name="identificador" type="text"
          autocomplete="username" spellcheck="false" autocapitalize="none"
          required autofocus style="margin-bottom:1rem;">
        <button type="submit" class="botao" style="width:100%;">Enviar link de acesso</button>
      </form>
      <p class="ajuda">Sem senha pra lembrar — mandamos um link de acesso único pro seu e-mail, válido por 15 minutos.</p>
      {% endif %}
    </div>
    <p class="ajuda" style="text-align:center; margin-top:1rem;">
      <a href="{{ url_for('privacidade') }}" style="color:var(--steel);">Política de Privacidade</a>
    </p>
  </div>
</div>
</body>
</html>
