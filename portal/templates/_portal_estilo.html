<!--
  Sistema de design do Portal do Cliente -- ver notas de decisão no
  final deste arquivo. Sem framework/build step, CSS puro + Google
  Fonts via CDN, incluído nas quatro telas via Jinja include.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1F5;
    --paper-raised: #FFFFFF;
    --line: #DFE3EA;
    --ink: #232428;
    --ink-deep: #131417;
    --steel: #626873;
    --blue: #396BB3;
    --blue-deep: #24487D;
    --blue-bright: #6FA0DC;
    --blue-soft: #E4ECF8;
    --signal: #B23B2E;
    --signal-soft: #F7E5E2;
    /* Terceiro estado do checklist: nem resolvido (azul) nem problema
       (sinal). Âmbar de "em conferência" -- contraste 5.6:1 sobre o
       fundo suave, acima do mínimo AA de 4.5:1 para texto pequeno. */
    --amber: #7A5709;
    --amber-soft: #F6EDDA;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .rotulo {
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: .01em;
    color: var(--ink);
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  a { color: var(--blue-deep); }
  a:hover { color: var(--blue); }
  /* textarea entrou na lista: estava de fora, então era o único
     controle do Portal sem foco visível. */
  a:focus-visible, button:focus-visible, input:focus-visible,
  select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  /* Link de pular a navegação. Fica fora da tela até receber foco --
     invisível pra quem usa mouse, primeiro item pra quem usa teclado.
     Não usa display:none nem visibility:hidden de propósito: os dois
     tirariam o link do caminho do Tab, que é justamente o ponto. */
  .pular-para-conteudo {
    position: absolute; left: -9999px; top: 0; z-index: 100;
    background: var(--ink-deep); color: #fff;
    padding: .7rem 1.1rem; border-radius: 0 0 var(--radius) 0;
    font-size: .9rem; font-weight: 600; text-decoration: none;
  }
  .pular-para-conteudo:focus {
    left: 0;
    color: #fff;
  }
  /* O <main> recebe foco por programa quando o link é usado; não deve
     ganhar contorno por isso -- quem clicou já sabe onde está. */
  main:focus { outline: none; }

  /* Marca -- a logo de verdade (PDF vetorial da identidade visual),
     em duas versões: escura (sobre fundo claro, telas de login/erro) e
     branca (sobre a barra preta do topo, telas internas). */
  .marca-logo { display: block; height: 38px; width: auto; }
  .marca-logo--grande { height: 54px; }

  /* "Ficha" -- o container principal, uma coluna só, como uma ficha de
     controle de tiro/protocolo de despachante: superfície branca limpa,
     borda fina, sombra suave (está sobre a mesa, não flutuando). */
  .ficha {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(19,20,23,.03), 0 12px 28px -18px rgba(19,20,23,.35);
  }

  /* Linha divisória entre seções da ficha. */
  .perfuracao {
    height: 0;
    border-top: 1px solid var(--line);
    margin: 0;
  }

  /* "Selo" -- carimbo de status, referência direta ao carimbo do
     despachante. Anel duplo, leve rotação, tipografia condensada
     maiúscula. Cor muda por status: azul = em andamento normal,
     sinalização = precisa de algo do cliente, neutro = encerrado. */
  .selo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 108px;
    padding: .3rem .65rem;
    border: 2px solid currentColor;
    border-radius: 999px;
    position: relative;
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    font-size: .72rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    text-align: center;
    transform: rotate(-2deg);
    animation: selo-carimbada .28s cubic-bezier(.2,1.4,.4,1) both;
  }
  .selo::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid currentColor;
    border-radius: 999px;
    opacity: .55;
  }
  .selo--padrao { color: var(--blue-deep); background: var(--blue-soft); }
  .selo--signal { color: var(--signal); background: var(--signal-soft); }
  .selo--neutro { color: var(--steel); background: #EAECEF; }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes selo-carimbada {
      0% { opacity: 0; transform: rotate(-2deg) scale(1.5); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: rotate(-2deg) scale(1); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .selo { animation: none; }
  }

  /* "Alvo" -- indicador de progresso do checklist de documentos, como
     um alvo de tiro: anel azul fechando conforme os documentos chegam,
     ponto central marcando "no alvo" quando completo. */
  .alvo {
    --pct: 0%;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: conic-gradient(var(--blue) var(--pct), var(--line) var(--pct) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .alvo::after {
    content: "";
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--paper-raised);
  }
  .alvo-completo { position: relative; }
  .alvo-completo::before {
    content: "";
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--blue-deep);
    z-index: 1;
  }
  .alvo--mini { width: 34px; height: 34px; }
  .alvo--mini::after { width: 22px; height: 22px; }
  .alvo--mini.alvo-completo::before { width: 6px; height: 6px; }

  /* Link "← Voltar" no topo da tela de detalhe de caso. */
  .link-voltar {
    display: inline-block;
    color: var(--steel);
    text-decoration: none;
    font-size: .85rem;
    margin-bottom: 1rem;
  }
  .link-voltar:hover { color: var(--blue-deep); }

  /* Mensagens de flash (sucesso/erro) pós-ação, ex.: depois de enviar
     um documento -- reaproveita as cores do .aviso. */
  .msg-flash {
    padding: .7rem 1rem;
    border-radius: var(--radius);
    font-size: .88rem;
    margin-bottom: 1.1rem;
  }
  .msg-flash--sucesso { background: var(--blue-soft); color: var(--blue-deep); border: 1px solid var(--line); }
  .msg-flash--erro { background: var(--signal-soft); color: var(--signal); border: 1px solid var(--line); }

  .badge-item {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: .1rem .4rem;
    border-radius: 2px;
    margin-right: .4rem;
  }
  .badge-item--sim { background: var(--blue-soft); color: var(--blue-deep); }
  .badge-item--nao { background: transparent; color: var(--steel); border: 1px solid var(--line); }
  .badge-item--aguardando { background: var(--amber-soft); color: var(--amber); }

  label {
    font-size: .82rem;
    font-weight: 600;
    color: var(--steel);
    display: block;
    margin-bottom: .3rem;
  }
  input[type=text], input[type=file], select, textarea {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .55rem .7rem;
    font-family: inherit;
    font-size: .95rem;
    color: var(--ink);
  }
  input[type=text]:focus, select:focus, textarea:focus {
    border-color: var(--blue);
  }

  .botao {
    display: inline-block;
    background: var(--ink-deep);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: .65rem 1.1rem;
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: .85rem;
    cursor: pointer;
  }
  .botao:hover { background: var(--blue-deep); }

  .aviso {
    background: var(--blue-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .8rem 1rem;
    font-size: .9rem;
    color: var(--blue-deep);
  }
  .aviso--erro { background: var(--signal-soft); color: var(--signal); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: .72rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--steel);
    border-bottom: 1px solid var(--line);
    padding: .5rem .3rem;
  }
  td {
    border-bottom: 1px solid var(--line);
    padding: .55rem .3rem;
    font-size: .92rem;
  }

  /* ---- Casca do Portal autenticado (sidebar + conteúdo) ----
     Menu lateral fixo em telas largas (como o painel admin); em telas
     estreitas vira gaveta puxada por um botão hambúrguer -- só CSS
     (checkbox escondido + seletor ~), sem nenhuma linha de JS. */
  .portal-shell { min-height: 100vh; }
  .portal-menu-toggle-input { position: absolute; opacity: 0; pointer-events: none; }
  /* O controle real do menu é invisível, então o foco dele precisa
     aparecer em outro lugar: acende o ☰ que a pessoa enxerga. Sem isto,
     quem chega no menu por Tab não vê nada acontecer. */
  .portal-menu-toggle-input:focus-visible ~ .portal-main .portal-topo-mobile span {
    outline: 2px solid var(--blue-bright);
    outline-offset: 3px;
    border-radius: 3px;
  }

  .portal-sidebar {
    width: 232px;
    background: var(--ink-deep);
    color: #fff;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; bottom: 0; left: 0;
    transform: translateX(-100%);
    transition: transform .22s ease;
    z-index: 40;
  }
  .portal-menu-toggle-input:checked ~ .portal-sidebar { transform: translateX(0); }

  .portal-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(10,10,12,.5);
    z-index: 35;
  }
  .portal-menu-toggle-input:checked ~ .portal-overlay { display: block; }

  .portal-sidebar-marca { padding: 22px 22px 18px; }

  .portal-nav { flex: 1; padding: 6px 0; overflow-y: auto; }
  .portal-nav a {
    display: flex; align-items: center; gap: .7rem;
    padding: .7rem 1.4rem;
    color: #C6CAD3;
    text-decoration: none;
    font-size: .92rem;
    border-left: 3px solid transparent;
  }
  .portal-nav a svg { flex-shrink: 0; opacity: .85; }
  .portal-nav a:hover { color: #fff; background: rgba(255,255,255,.05); }
  .portal-nav a.ativo {
    color: #fff;
    background: rgba(57,107,179,.2);
    border-left-color: var(--blue);
    font-weight: 600;
  }
  .portal-nav a.ativo svg { opacity: 1; }

  .portal-sidebar-rodape {
    padding: 1rem 1.4rem 1.3rem;
    border-top: 1px solid rgba(255,255,255,.12);
    font-size: .82rem;
    color: #C6CAD3;
  }
  .portal-sidebar-rodape a { color: #fff; display: block; margin-top: .35rem; }

  .portal-topo-mobile {
    display: flex; align-items: center; gap: .9rem;
    background: var(--ink-deep); color: #fff;
    padding: 13px 18px;
    position: sticky; top: 0; z-index: 30;
    cursor: pointer;
  }
  .portal-topo-mobile .marca-logo { height: 28px; }

  .portal-conteudo { padding: 26px 18px 64px; max-width: 700px; margin: 0 auto; width: 100%; box-sizing: border-box; }

  @media (min-width: 900px) {
    .portal-shell { display: flex; }
    .portal-sidebar { position: sticky; top: 0; height: 100vh; transform: none; flex-shrink: 0; }
    .portal-overlay, .portal-topo-mobile { display: none !important; }
    .portal-main { flex: 1; min-width: 0; }
  }

  /* ---- Componentes da Home / listas resumidas ---- */
  .saudacao { font-size: 1.3rem; margin: 0 0 .2rem; }
  .subsaudacao { color: var(--steel); font-size: .92rem; margin: 0 0 1.6rem; }

  .secao-titulo {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 2rem 0 .8rem;
  }
  .secao-titulo h2 { margin: 0; }
  .secao-titulo a { font-size: .82rem; text-decoration: none; }
  .secao-titulo a:hover { text-decoration: underline; }

  .destaques-grid { display: grid; grid-template-columns: 1fr; gap: .9rem; }
  @media (min-width: 560px) { .destaques-grid { grid-template-columns: 1fr 1fr; } }

  .destaque-mini {
    display: flex; align-items: center; gap: 1rem;
    padding: 1.1rem 1.2rem;
    text-decoration: none; color: inherit;
    transition: border-color .15s;
  }
  .destaque-mini:hover { border-color: var(--blue); text-decoration: none; color: inherit; }
  .destaque-mini-icone {
    flex-shrink: 0; width: 42px; height: 42px; border-radius: 50%;
    background: var(--blue-soft); color: var(--blue-deep);
    display: flex; align-items: center; justify-content: center;
  }
  .destaque-mini-eyebrow { font-size: .68rem; letter-spacing: .06em; text-transform: uppercase; color: var(--steel); margin: 0 0 .2rem; }
  .destaque-mini-titulo { font-size: .95rem; margin: 0 0 .15rem; line-height: 1.3; }
  .destaque-mini-meta { font-size: .78rem; color: var(--steel); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin-top: .9rem; }
  .stat-card {
    padding: 1rem 1.2rem;
    text-decoration: none; color: inherit;
    border-left: 3px solid var(--blue);
    transition: border-color .15s;
  }
  .stat-card:hover { text-decoration: none; color: inherit; background: var(--blue-soft); }
  .stat-numero { display: block; font-family: 'Big Shoulders', system-ui, sans-serif; font-weight: 700; font-size: 1.9rem; line-height: 1; color: var(--ink); }
  .stat-rotulo { font-size: .78rem; color: var(--steel); }

  .lista-linha {
    display: flex; align-items: center; gap: 1rem;
    padding: .9rem 0; border-bottom: 1px solid var(--line);
    text-decoration: none; color: inherit;
  }
  .lista-linha:last-child { border-bottom: none; }
  .lista-linha:hover { color: inherit; text-decoration: none; }
  .lista-linha-corpo { flex: 1; min-width: 0; }
  .lista-linha-titulo { font-size: .95rem; margin: 0 0 .3rem; }
  .lista-linha-meta { color: var(--steel); font-size: .8rem; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .lista-linha-seta { color: var(--steel); font-size: 1.2rem; flex-shrink: 0; }

  .estado-vazio { padding: 1.3rem 1.4rem; color: var(--steel); }

  /* "Folhinha" -- folha de calendário de parede/mesa, com furo de
     espiral e a página arrancada mostrando o dia -- usada em qualquer
     tela que mostre data de campeonato (Home, Campeonatos). */
  .folhinha {
    width: 58px;
    flex-shrink: 0;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 14px -8px rgba(19,20,23,.45);
    transform: rotate(-3deg);
    background: var(--paper-raised);
  }
  .folhinha-mes {
    background: var(--ink-deep);
    color: #fff;
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    font-size: .62rem;
    letter-spacing: .06em;
    text-align: center;
    padding: .32rem 0 .5rem;
    position: relative;
  }
  .folhinha-mes::before, .folhinha-mes::after {
    content: "";
    position: absolute;
    top: -3px;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--paper);
  }
  .folhinha-mes::before { left: 9px; }
  .folhinha-mes::after { right: 9px; }
  .folhinha-dia {
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1;
    text-align: center;
    color: var(--ink);
    padding: .38rem 0 .42rem;
  }
  .folhinha--destaque { width: 86px; transform: rotate(-2deg); }
  .folhinha--destaque .folhinha-mes { background: var(--blue); font-size: .72rem; padding: .42rem 0 .6rem; }
  .folhinha--destaque .folhinha-mes::before { left: 13px; }
  .folhinha--destaque .folhinha-mes::after { right: 13px; }
  .folhinha--destaque .folhinha-dia { font-size: 2.15rem; padding: .5rem 0 .55rem; }
  .folhinha--mini { width: 40px; }
  .folhinha--mini .folhinha-mes { font-size: .52rem; padding: .22rem 0 .36rem; }
  .folhinha--mini .folhinha-mes::before { left: 6px; }
  .folhinha--mini .folhinha-mes::after { right: 6px; }
  .folhinha--mini .folhinha-dia { font-size: 1.05rem; padding: .22rem 0 .28rem; }

  .pill {
    display: inline-block;
    font-size: .68rem;
    padding: .16rem .5rem;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: .02em;
  }
  .pill--contagem { background: var(--ink-deep); color: #fff; text-transform: uppercase; }
  .pill--duracao { background: var(--blue-soft); color: var(--blue-deep); }

  /* Selo pequeno de nível do CR (1/2/3), logo abaixo da saudação na
     Home -- nível aqui é só o que define o que o atirador pode ter
     (calibre/quantidade), não uma conquista, então nada de bronze/
     prata/ouro: fica na própria família azul da identidade, uma
     intensidade por nível (quanto maior o nível, mais escuro). */
  .nivel-tag { margin: .3rem 0 0; }
  .pill--nivel1 { background: var(--blue-soft); color: var(--blue-deep); }
  .pill--nivel2 { background: var(--blue); color: #fff; }
  .pill--nivel3 { background: var(--blue-deep); color: #fff; }

  /* ==================================================================
     TEMA 2026-09 -- o mesmo do painel (webapp/templates/index.html,
     bloco "TEMA 2026-09"), pedido do usuário ao revisar o sistema
     inteiro: simples, moderno, prático. Fica no fim para sobrescrever
     sem apagar o desenho acima.

     O que NÃO mudou, de propósito: o "alvo" de progresso e a "folhinha"
     -- são a identidade do Portal e não pesam na leitura. O que mudou:
     - mesma paleta do painel (os dois apps são o mesmo sistema);
     - nada em MAIÚSCULAS: botão, selo, cabeçalho de tabela, eyebrow;
     - sombra pesada sai, fica a borda fina;
     - o selo continua carimbo (moldura dupla), mas reto e sem a batida
       animada -- ela chamava atenção toda vez que a tela abria, mesmo
       quando nada tinha mudado.
     ================================================================== */
  :root {
    --paper: #F4F5F3;
    --line: #E3E6E8;
    --ink: #16181D;
    --ink-deep: #16181D;
    --steel: #5B6470;
    --blue: #2F5FA7;
    --blue-deep: #244A85;
    --blue-soft: #E8EEF8;
    --signal: #C0392B;
    --signal-soft: #FBEDEB;
    --radius: 10px;
  }
  .ficha { box-shadow: none; }

  .selo {
    transform: none; animation: none;
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600;
    font-size: .78rem; letter-spacing: 0; text-transform: none;
    border-width: 1px; min-width: 0; padding: .25rem .75rem;
  }

  .botao {
    background: var(--blue);
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-weight: 600;
    font-size: .92rem; letter-spacing: 0; text-transform: none;
    padding: .6rem 1.1rem;
  }
  .botao:hover { background: var(--blue-deep); }

  input[type=text], input[type=email], input[type=file], select, textarea {
    background: #fff; border-color: #D5D9DD;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); outline: none;
  }

  th { font-size: .78rem; letter-spacing: 0; text-transform: none; font-weight: 600; }
  .badge-item {
    font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: .74rem; font-weight: 600;
    letter-spacing: 0; text-transform: none; border-radius: 6px; padding: .1rem .5rem;
  }
  .destaque-mini-eyebrow { letter-spacing: 0; text-transform: none; font-size: .75rem; }
  .pill--contagem { text-transform: none; }

  .portal-sidebar { background: var(--ink-deep); }
  .portal-nav a.ativo { background: rgba(255,255,255,.10); border-left-color: #6E9BE0; }
  .aviso, .msg-flash { border-radius: var(--radius); }
  .folhinha { box-shadow: 0 1px 2px rgba(22,24,29,.12); }

  /* Título de cada página do Portal. Era um h2 pequeno, cinza e em
     maiúsculas escrito à mão em dez telas -- parecia rótulo, não
     título. Agora é classe, no mesmo tom dos títulos do painel. */
  .titulo-pagina {
    font-family: 'Big Shoulders', system-ui, sans-serif; font-weight: 700;
    font-size: 1.9rem; line-height: 1.05; color: var(--ink);
  }
  /* Seção dentro de uma página (ex.: "Enviar um documento" no caso):
     menor que o título do que ela está dentro. */
  .titulo-secao {
    font-family: 'Big Shoulders', system-ui, sans-serif; font-weight: 700;
    font-size: 1.35rem; line-height: 1.1; color: var(--ink);
  }
</style>
