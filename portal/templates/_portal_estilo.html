<!--
  Sistema de design do Portal do Cliente -- ver notas de decisão no
  final deste arquivo. Sem framework/build step, CSS puro + Google
  Fonts via CDN, incluído nas quatro telas via Jinja include.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EEF1F5;
    --paper-raised: #FFFFFF;
    --line: #DFE3EA;
    --ink: #232428;
    --ink-deep: #131417;
    --steel: #626873;
    --blue: #396BB3;
    --blue-deep: #24487D;
    --blue-bright: #6FA0DC;
    --blue-soft: #E4ECF8;
    --signal: #B23B2E;
    --signal-soft: #F7E5E2;
    --radius: 8px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 15.5px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, .rotulo {
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: .01em;
    color: var(--ink);
  }

  .mono { font-family: 'IBM Plex Mono', monospace; }

  a { color: var(--blue-deep); }
  a:hover { color: var(--blue); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  /* Marca -- a logo de verdade (PDF vetorial da identidade visual),
     em duas versões: escura (sobre fundo claro, telas de login/erro) e
     branca (sobre a barra preta do topo, telas internas). */
  .marca-logo { display: block; height: 38px; width: auto; }
  .marca-logo--grande { height: 54px; }

  /* "Ficha" -- o container principal, uma coluna só, como uma ficha de
     controle de tiro/protocolo de despachante: superfície branca limpa,
     borda fina, sombra suave (está sobre a mesa, não flutuando). */
  .ficha {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 1px 0 rgba(19,20,23,.03), 0 12px 28px -18px rgba(19,20,23,.35);
  }

  /* Linha divisória entre seções da ficha. */
  .perfuracao {
    height: 0;
    border-top: 1px solid var(--line);
    margin: 0;
  }

  /* "Selo" -- carimbo de status, referência direta ao carimbo do
     despachante. Anel duplo, leve rotação, tipografia condensada
     maiúscula. Cor muda por status: azul = em andamento normal,
     sinalização = precisa de algo do cliente, neutro = encerrado. */
  .selo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 108px;
    padding: .3rem .65rem;
    border: 2px solid currentColor;
    border-radius: 999px;
    position: relative;
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    font-size: .72rem;
    letter-spacing: .07em;
    text-transform: uppercase;
    text-align: center;
    transform: rotate(-2deg);
    animation: selo-carimbada .28s cubic-bezier(.2,1.4,.4,1) both;
  }
  .selo::before {
    content: "";
    position: absolute;
    inset: 3px;
    border: 1px solid currentColor;
    border-radius: 999px;
    opacity: .55;
  }
  .selo--padrao { color: var(--blue-deep); background: var(--blue-soft); }
  .selo--signal { color: var(--signal); background: var(--signal-soft); }
  .selo--neutro { color: var(--steel); background: #EAECEF; }

  @media (prefers-reduced-motion: no-preference) {
    @keyframes selo-carimbada {
      0% { opacity: 0; transform: rotate(-2deg) scale(1.5); }
      60% { opacity: 1; }
      100% { opacity: 1; transform: rotate(-2deg) scale(1); }
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .selo { animation: none; }
  }

  /* "Alvo" -- indicador de progresso do checklist de documentos, como
     um alvo de tiro: anel azul fechando conforme os documentos chegam,
     ponto central marcando "no alvo" quando completo. */
  .alvo {
    --pct: 0%;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: conic-gradient(var(--blue) var(--pct), var(--line) var(--pct) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .alvo::after {
    content: "";
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--paper-raised);
  }
  .alvo-completo { position: relative; }
  .alvo-completo::before {
    content: "";
    position: absolute;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--blue-deep);
    z-index: 1;
  }
  .alvo--mini { width: 34px; height: 34px; }
  .alvo--mini::after { width: 22px; height: 22px; }
  .alvo--mini.alvo-completo::before { width: 6px; height: 6px; }

  /* Link "← Voltar" no topo da tela de detalhe de caso. */
  .link-voltar {
    display: inline-block;
    color: var(--steel);
    text-decoration: none;
    font-size: .85rem;
    margin-bottom: 1rem;
  }
  .link-voltar:hover { color: var(--blue-deep); }

  /* Mensagens de flash (sucesso/erro) pós-ação, ex.: depois de enviar
     um documento -- reaproveita as cores do .aviso. */
  .msg-flash {
    padding: .7rem 1rem;
    border-radius: var(--radius);
    font-size: .88rem;
    margin-bottom: 1.1rem;
  }
  .msg-flash--sucesso { background: var(--blue-soft); color: var(--blue-deep); border: 1px solid var(--line); }
  .msg-flash--erro { background: var(--signal-soft); color: var(--signal); border: 1px solid var(--line); }

  .badge-item {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: .68rem;
    letter-spacing: .03em;
    text-transform: uppercase;
    padding: .1rem .4rem;
    border-radius: 2px;
    margin-right: .4rem;
  }
  .badge-item--sim { background: var(--blue-soft); color: var(--blue-deep); }
  .badge-item--nao { background: transparent; color: var(--steel); border: 1px solid var(--line); }

  label {
    font-size: .82rem;
    font-weight: 600;
    color: var(--steel);
    display: block;
    margin-bottom: .3rem;
  }
  input[type=text], input[type=file], select, textarea {
    width: 100%;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .55rem .7rem;
    font-family: inherit;
    font-size: .95rem;
    color: var(--ink);
  }
  input[type=text]:focus, select:focus, textarea:focus {
    border-color: var(--blue);
  }

  .botao {
    display: inline-block;
    background: var(--ink-deep);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: .65rem 1.1rem;
    font-family: 'Big Shoulders', system-ui, sans-serif;
    font-weight: 700;
    letter-spacing: .04em;
    text-transform: uppercase;
    font-size: .85rem;
    cursor: pointer;
  }
  .botao:hover { background: var(--blue-deep); }

  .aviso {
    background: var(--blue-soft);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: .8rem 1rem;
    font-size: .9rem;
    color: var(--blue-deep);
  }
  .aviso--erro { background: var(--signal-soft); color: var(--signal); }

  table { width: 100%; border-collapse: collapse; }
  th {
    text-align: left;
    font-size: .72rem;
    letter-spacing: .05em;
    text-transform: uppercase;
    color: var(--steel);
    border-bottom: 1px solid var(--line);
    padding: .5rem .3rem;
  }
  td {
    border-bottom: 1px solid var(--line);
    padding: .55rem .3rem;
    font-size: .92rem;
  }
</style>
<!--
  Notas de decisão (skill frontend-design, revisão 2026-07-25):
  - Gatilho da revisão: a marca real (LOGO SMITH 150X100CM.pdf) chegou
    depois do primeiro desenho do Portal -- carvão quase-preto (#2B2A2D)
    + azul (#396BB3) num lettering condensado/inclinado, estilo esportivo
    -- então a paleta bronze/papel-creme do rascunho anterior foi
    substituída pela identidade de verdade, extraída por amostragem de
    pixel do PDF vetorial (não é preto/azul genérico escolhido no escuro).
  - Direção mantida: "ficha de controle" -- ainda cruza os dois
    vocabulários reais deste negócio: (1) o alvo de tiro esportivo (anéis
    concêntricos = precisão, "no alvo") e (2) o carimbo/ficha de
    protocolo do despachante brasileiro. Isso não mudou -- só a cor.
  - Mudança de acabamento: raio de borda maior (8px vs 3px) e sombra mais
    suave/profunda, divisórias tracejadas trocadas por linha sólida fina
    -- o pedido era "mais moderno"; o carimbo/ficha continuam como
    conceito, mas a execução fica mais limpa, menos "papel antigo".
  - Vermelho (--signal) sobrevive só pra erro/"precisa de algo do
    cliente" -- é convenção semântica (não decoração), mantê-lo fora da
    tríade preto/azul/branco pedida seria pior pra quem depende de cor
    pra notar um problema.
  - Tipografia mantida: Big Shoulders (condensada, ecoa o lettering
    esportivo/inclinado da logo real) + IBM Plex Sans/Mono -- já
    funcionava com a marca antes de eu ver a logo real, e a família
    condensada bate com o peso do "SMITH" da identidade.
  - Assinatura: continuam sendo o "alvo" de progresso e o "selo"
    carimbado -- agora recoloridos, com o centro do alvo em azul-profundo
    em vez do antigo laranja-ferrugem (evita introduzir uma terceira cor
    de destaque fora do que foi pedido).
-->
